name: desktop-release

# Phase 1 CI: build the Rust engine + Electron installers for macOS and
# Windows from one workflow. Trigger manually or by tag; artifacts attach to
# the run (publish to GitHub Releases when a tag is pushed).
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # arm64
            rust-targets: aarch64-apple-darwin
          - os: macos-13         # x64 (intel)
            rust-targets: x86_64-apple-darwin
          - os: windows-latest    # x64
            rust-targets: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: rujirapongsn2/sagent
          path: sagent-src

      - uses: actions/checkout@v4
        with:
          path: app-src

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build sagent-engine
        shell: bash
        run: |
          cd sagent-src
          cargo build --locked --release --manifest-path sagent-engine/Cargo.toml --target ${{ matrix.rust-targets }}

      - name: Stage engine binary
        shell: bash
        run: |
          mkdir -p app-src/engine
          if [[ "${{ matrix.os }}" == windows-latest ]]; then
            cp sagent-src/sagent-engine/target/${{ matrix.rust-targets }}/release/sagent-engine.exe app-src/engine/sagent-engine.exe
          else
            cp sagent-src/sagent-engine/target/${{ matrix.rust-targets }}/release/sagent-engine app-src/engine/sagent-engine
          fi

      - name: Build frontend
        run: |
          cd app-src/app
          npm ci
          npm run build

      - name: Build desktop bundle + installer
        shell: bash
        run: |
          cd app-src/desktop
          npm ci
          npm run build
          npx electron-builder --publish never ${{ startsWith(matrix.os, 'macos') && '--mac' || '--win' }}

      - uses: actions/upload-artifact@v4
        with:
          name: sagent-desktop-${{ matrix.os }}
          path: app-src/desktop/release/*.dmg
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: sagent-desktop-${{ matrix.os }}-exe
          path: app-src/desktop/release/*.exe
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.dmg
            artifacts/*.exe
